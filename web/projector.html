<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rzutnik — TTRPG Listener</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        font: 15px system-ui, sans-serif;
        color: #fff;
      }

      body.idle {
        cursor: none;
      }

      #hint {
        position: fixed;
        left: 50%;
        bottom: 40px;
        transform: translateX(-50%);
        padding: 12px 20px;
        border-radius: 12px;
        background: rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(8px);
        transition: opacity 0.6s;
      }

      body.idle #hint {
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="hint">Dwuklik = pełny ekran · Esc = wyjście z pełnego ekranu</div>
    <script type="module" src="/src/projector.ts"></script>
  </body>
</html>
